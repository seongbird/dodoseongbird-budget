<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>우리집 가계부</title>
  <link rel="stylesheet" href="styles.css?v=20260830d" />
</head>
<body class="locked pin-pending">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">₩</div>
        <div>
          <strong>우리집 가계부</strong>
          <span>Couple Budget</span>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <span class="dot"></span>
        <div class="sync-meta"><div class="sync-line"><small id="syncStatus">Google Sheets 연결 확인 중…</small><button id="retrySyncBtn" class="retry-sync-btn" type="button" title="다시 동기화" aria-label="다시 동기화" hidden>↻</button></div><small class="app-version">v33.0 · 2026-08-30</small></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="메뉴 열기">≡</button>
        <div>
          <h1 id="pageTitle">지출 등록</h1>
          <p id="pageSubtitle">지출을 빠르게 기록하고 이번 달 잔액을 확인하세요.</p>
        </div>
        <div class="top-actions">
          <button class="month-step-btn" id="prevMonthBtn" type="button" aria-label="이전 달" title="이전 달">‹</button>
          <label class="month-picker-wrap">
            <span>기준월</span>
            <input id="globalMonth" type="month" />
          </label>
          <button class="month-step-btn" id="nextMonthBtn" type="button" aria-label="다음 달" title="다음 달">›</button>
          <button class="current-month-btn" id="currentMonthBtn" type="button" aria-label="이번 달로 이동" title="이번 달">이번달</button>
        </div>
      </header>

      <section id="app"></section>
    </main>
  </div>


  <div id="pinGate" class="pin-gate show" aria-hidden="false">
    <div class="pin-card">
      <div class="brand-mark pin-brand">₩</div>
      <h2>우리집 가계부</h2>
      <p>부부 전용 PIN을 입력해 주세요.</p>
      <form id="pinForm">
        <input id="pinInput" class="pin-input" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="PIN" required>
        <button class="btn primary pin-btn" type="submit">가계부 열기</button>
      </form>
      <div id="pinError" class="pin-error"></div>
      <div class="pin-version">v33.0 · 2026-08-30</div>
    </div>
  </div>
  <div class="global-add-wrap" id="globalAddWrap">
    <div class="global-add-menu" id="globalAddMenu" hidden>
      <button type="button" data-page="add"><span>＋</span><strong>변동지출</strong></button>
      <button type="button" data-page="fixed"><span>⌂</span><strong>기본지출</strong></button>
      <button type="button" data-page="income"><span>↗</span><strong>월별수입</strong></button>
      <button type="button" data-page="cards"><span>▤</span><strong>카드기록</strong></button>
    </div>
    <button type="button" class="global-add-btn" id="globalAddBtn" aria-label="빠른 등록" title="빠른 등록">＋</button>
  </div>
  <div id="toast" class="toast"></div>
  <div id="backdrop" class="backdrop"></div>
  <script src="config.js"></script>
  <script src="app.js?v=20260830d"></script>
</body>
</html>
