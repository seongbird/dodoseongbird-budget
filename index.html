<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>우리집 가계부</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">₩</div>
        <div>
          <strong>우리집 가계부</strong>
          <span>Couple Budget</span>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <span class="dot"></span>
        <small id="syncStatus">Google Sheets 연결 확인 중…</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="메뉴 열기">☰</button>
        <div>
          <h1 id="pageTitle">변동지출 등록</h1>
          <p id="pageSubtitle">지출을 빠르게 기록하고 이번 달 잔액을 확인하세요.</p>
        </div>
        <div class="top-actions">
          <label class="month-picker-wrap">
            <span>기준월</span>
            <input id="globalMonth" type="month" />
          </label>
        </div>
      </header>

      <section id="app"></section>
    </main>
  </div>


  <div id="pinGate" class="pin-gate" aria-hidden="true">
    <div class="pin-card">
      <div class="brand-mark pin-brand">₩</div>
      <h2>우리집 가계부</h2>
      <p>부부 전용 PIN을 입력해 주세요.</p>
      <form id="pinForm">
        <input id="pinInput" class="pin-input" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="PIN" required>
        <button class="btn primary pin-btn" type="submit">가계부 열기</button>
      </form>
      <div id="pinError" class="pin-error"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="backdrop" class="backdrop"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
